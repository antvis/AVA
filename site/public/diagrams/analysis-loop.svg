<svg xmlns="http://www.w3.org/2000/svg" width="680" height="912" viewBox="0 0 680 912" role="img" aria-labelledby="title desc">
<title id="title">Loop analysis flow</title>
<desc id="desc">Choose an EXPLORE, REFINE, SQL, or CONFIRM action using the accumulated history. A confirmation with a successful answer returns the result. Otherwise record the observations and repeat within maxSteps. At the limit, return an available answer or make one final SQL attempt. Model or protocol errors stop the loop.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a909b"/></marker></defs>
<style>
.label, .branch { font-family: system-ui, -apple-system, sans-serif; text-anchor: middle; fill: #203c4a; font-size: 14px; }
.branch { font-size: 12px; fill: #526e7c; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
.node { fill: #f8fafb; stroke: #cbd7de; stroke-width: 1.3; }
.accent, .decision { fill: #edf9fc; stroke: #73b9c9; stroke-width: 1.3; }
.error { fill: #fff6f3; stroke: #e3b8a8; }
.edge { fill: none; stroke: #7a909b; stroke-width: 1.5; stroke-linejoin: round; }
</style>
<path d="M230 72 V112" class="edge" marker-end="url(#arrow)"/>
<path d="M230 236 V278" class="edge" marker-end="url(#arrow)"/>
<path d="M360 324 H460" class="edge" marker-end="url(#arrow)"/>
<path d="M230 370 V410" class="edge" marker-end="url(#arrow)"/>
<path d="M230 466 V502" class="edge" marker-end="url(#arrow)"/>
<path d="M100 548 H30 V174 H80" class="edge" marker-end="url(#arrow)"/>
<path d="M230 594 V634" class="edge" marker-end="url(#arrow)"/>
<path d="M360 680 H555 V350" class="edge" marker-end="url(#arrow)"/>
<path d="M230 726 V768" class="edge" marker-end="url(#arrow)"/>
<path d="M230 824 V864" class="edge" marker-end="url(#arrow)"/>
<rect x="80" y="24" width="300" height="48" rx="10" class="node accent"/><text x="230.0" y="53.0" class="label"><tspan x="230.0" dy="0">Question + data context</tspan></text>
<rect x="80" y="112" width="300" height="124" rx="10" class="node "/><text x="230.0" y="139.0" class="label"><tspan x="230.0" dy="0">Choose and perform one action</tspan><tspan x="230.0" dy="20">EXPLORE · run exploratory queries</tspan><tspan x="230.0" dy="20">REFINE · revise the plan</tspan><tspan x="230.0" dy="20">SQL · execute an answer query</tspan><tspan x="230.0" dy="20">CONFIRM · verify the answer</tspan></text>
<path d="M230 278 L360 324 L230 370 L100 324 Z" class="decision"/><text x="230" y="319" class="label"><tspan x="230" dy="0">CONFIRM + successful</tspan><tspan x="230" dy="20">answer available?</tspan></text>
<rect x="460" y="298" width="190" height="52" rx="10" class="node accent"/><text x="555.0" y="329.0" class="label"><tspan x="555.0" dy="0">Return result</tspan></text>
<rect x="80" y="410" width="300" height="56" rx="10" class="node "/><text x="230.0" y="433.0" class="label"><tspan x="230.0" dy="0">Record action and observations</tspan><tspan x="230.0" dy="20">including query errors</tspan></text>
<path d="M230 502 L360 548 L230 594 L100 548 Z" class="decision"/><text x="230" y="553" class="label"><tspan x="230" dy="0">Steps left?</tspan></text>
<path d="M230 634 L360 680 L230 726 L100 680 Z" class="decision"/><text x="230" y="675" class="label"><tspan x="230" dy="0">Successful answer</tspan><tspan x="230" dy="20">available?</tspan></text>
<rect x="80" y="768" width="300" height="56" rx="10" class="node "/><text x="230.0" y="791.0" class="label"><tspan x="230.0" dy="0">One final SQL attempt</tspan><tspan x="230.0" dy="20">Generate and execute an answer</tspan></text>
<rect x="80" y="864" width="300" height="40" rx="10" class="node accent"/><text x="230.0" y="889.0" class="label"><tspan x="230.0" dy="0">Return result or throw error</tspan></text>
<text x="410" y="312" class="branch"><tspan x="410" dy="0">Yes</tspan></text>
<text x="247" y="396" class="branch"><tspan x="247" dy="0">No</tspan></text>
<text x="59" y="536" class="branch"><tspan x="59" dy="0">Yes</tspan></text>
<text x="247" y="622" class="branch"><tspan x="247" dy="0">No</tspan></text>
<text x="436" y="668" class="branch"><tspan x="436" dy="0">Yes</tspan></text>
<text x="247" y="754" class="branch"><tspan x="247" dy="0">No</tspan></text>
</svg>
