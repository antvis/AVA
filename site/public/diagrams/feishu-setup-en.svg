<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" aria-labelledby="title desc">
  <title id="title">Feishu Bitable setup flow</title>
  <desc id="desc">Create an app, enable read APIs and publish, grant document and Wiki space access, copy the URL, then bind credentials and verify data.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7a909b"/></marker></defs>
  <style>text{font-family:system-ui,sans-serif;fill:#203c4a}.heading{font-size:17px;font-weight:600}.detail{font-size:14px;fill:#526e7c}.number{font-size:16px;fill:#fff;text-anchor:middle}.node{fill:#f8fafb;stroke:#cbd7de}.edge{stroke:#7a909b;stroke-width:1.5;marker-end:url(#arrow)}</style>
  <path d="M340 92V118" class="edge"/><path d="M340 194V220" class="edge"/><path d="M340 296V322" class="edge"/><path d="M340 398V424" class="edge"/>
  <rect x="36" y="16" width="608" height="76" rx="12" class="node"/>
  <circle cx="72" cy="54" r="18" fill="#397f97"/><text x="72" y="60" class="number">1</text>
  <text x="108" y="47" class="heading">Create an enterprise custom app</text><text x="108" y="72" class="detail">Open Platform → Credentials → App ID / App Secret</text>
  <rect x="36" y="118" width="608" height="76" rx="12" class="node"/>
  <circle cx="72" cy="156" r="18" fill="#397f97"/><text x="72" y="162" class="number">2</text>
  <text x="108" y="149" class="heading">Enable read API permissions and publish</text><text x="108" y="174" class="detail">Read fields and records; Wiki URLs also need Wiki read APIs</text>
  <rect x="36" y="220" width="608" height="76" rx="12" class="node"/>
  <circle cx="72" cy="258" r="18" fill="#397f97"/><text x="72" y="264" class="number">3</text>
  <text x="108" y="251" class="heading">Grant access to the target Bitable</text><text x="108" y="276" class="detail">Add the same app; Wiki URLs also need Wiki space access</text>
  <rect x="36" y="322" width="608" height="76" rx="12" class="node"/>
  <circle cx="72" cy="360" r="18" fill="#397f97"/><text x="72" y="366" class="number">4</text>
  <text x="108" y="353" class="heading">Copy the target table URL</text><text x="108" y="378" class="detail">Keep table; view does not restrict the records loaded</text>
  <rect x="36" y="424" width="608" height="76" rx="12" fill="#edf9fc" stroke="#73b9c9"/>
  <circle cx="72" cy="462" r="18" fill="#397f97"/><text x="72" y="468" class="number">5</text>
  <text x="108" y="455" class="heading">Bind credentials and verify the data</text><text x="108" y="480" class="detail">ava source → ava schema → ava query · Read-only view: data</text>
</svg>
