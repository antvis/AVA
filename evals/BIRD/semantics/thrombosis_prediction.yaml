      - name: c3
        column: C3
        type: number
        description: "complement 3. Commonsense evidence:Normal range: N > 35"
      - name: c4
        column: C4
        type: number
        description: "complement 4. Commonsense evidence:Normal range: N > 10"
      - name: dna_ii
        column: DNA-II
        type: number
        description: "anti-DNA. Commonsense evidence:Normal range: N < 8"
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: max_hgb
        agg: max
        column: HGB
        description: max of HGB over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_id
        agg: count
        column: ID
        description: count of ID over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: avg_alb
        agg: avg
        column: ALB
        description: avg of ALB over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_distinct_id
        agg: count_distinct
        column: ID
        description: count distinct of ID over the selected Laboratory records. Apply filters and grouping explicitly;
          joins can repeat records.
      - name: avg_ldh
        agg: avg
        column: LDH
        description: avg of LDH over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: avg_ua
        agg: avg
        column: UA
        description: avg of UA over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: avg_hct
        agg: avg
        column: HCT
        description: avg of HCT over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: max_gpt
        agg: max
        column: GPT
        description: max of GPT over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: avg_pt
        agg: avg
        column: PT
        description: avg of PT over the selected Laboratory records. Apply filters and grouping explicitly; joins can
          repeat records.
  - name: patient
    table: Patient
    description: One patient. Description is first record date, First Date is first hospital visit, Birthday is birth
      date. These are not interchangeable. Reference-informed from this database and its dev golden SQL. Preserve
      record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: ID
        type: number
        description: identification of the patient Part of the declared primary key.
      - name: sex
        column: SEX
        type: string
        description: "Sex. F: female; M: male"
      - name: birthday
        column: Birthday
        type: time
        description: "Birthday Source date/time: inspect stored representation and cast before DuckDB date functions."
      - name: description
        column: Description
        type: time
        description: "the first date when a patient data was recorded. null or empty: not recorded Source date/time:
          inspect stored representation and cast before DuckDB date functions."
      - name: first_date
        column: First Date
        type: time
        description: "the date when a patient came to the hospital Source date/time: inspect stored representation and cast
          before DuckDB date functions."
      - name: admission
        column: Admission
        type: string
        description: patient was admitted to the hospital (+) or followed at the outpatient clinic (-)
      - name: diagnosis
        column: Diagnosis
        type: string
        description: disease names
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_id
        agg: count
        column: ID
        description: count of ID over the selected Patient records. Apply filters and grouping explicitly; joins can repeat
          records.
      - name: count_distinct_id
        agg: count_distinct
        column: ID
        description: count distinct of ID over the selected Patient records. Apply filters and grouping explicitly; joins
          can repeat records.
      - name: count_diagnosis
        agg: count
        column: Diagnosis
        description: count of Diagnosis over the selected Patient records. Apply filters and grouping explicitly; joins can
          repeat records.
joins:
  - from: examination
    to: patient
    type: left
    keys:
      - from: ID
        to: ID
  - from: laboratory
    to: patient
    type: left
    keys:
      - from: ID
        to: ID
