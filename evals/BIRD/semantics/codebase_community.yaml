      - name: sum_score
        agg: sum
        column: Score
        description: sum of Score over the selected posts records. Apply filters and grouping explicitly; joins can repeat
          records.
      - name: avg_view_count
        agg: avg
        column: ViewCount
        description: avg of ViewCount over the selected posts records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: sum_view_count
        agg: sum
        column: ViewCount
        description: sum of ViewCount over the selected posts records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: max_favorite_count
        agg: max
        column: FavoriteCount
        description: max of FavoriteCount over the selected posts records. Apply filters and grouping explicitly; joins can
