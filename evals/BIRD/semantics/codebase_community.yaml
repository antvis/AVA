# Source-grounded BIRD dev_20251106 configuration; see README.md and provenance.json.
dialect: duckdb
models:
  - name: badges
    table: badges
    description: One badge award to a user; repeated badge names are separate awards. Reference-informed from this
      database and its dev golden SQL. Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: Id
        type: number
        description: the badge id Part of the declared primary key.
      - name: user_id
        column: UserId
        type: number
        description: User Id. the unique id of the user
      - name: name
        column: Name
        type: string
        description: the badge name the user obtained
      - name: date
        column: Date
        type: time
        description: "the date that the user obtained the badge Source date/time: inspect stored representation and cast
          before DuckDB date functions."
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_id
        agg: count
        column: Id
        description: count of Id over the selected badges records. Apply filters and grouping explicitly; joins can repeat
          records.
      - name: count_distinct_user_id
        agg: count_distinct
        column: UserId
        description: count distinct of UserId over the selected badges records. Apply filters and grouping explicitly;
          joins can repeat records.
      - name: count_user_id
        agg: count
        column: UserId
        description: count of UserId over the selected badges records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_name
        agg: count
        column: Name
        description: count of Name over the selected badges records. Apply filters and grouping explicitly; joins can
          repeat records.
  - name: comments
    table: comments
    description: One comment on a post made by a user; multiple comments may come from the same user.
      Reference-informed from this database and its dev golden SQL. Preserve record identity for top-N; joins may
      multiply rows.
    dimensions:
      - name: id
        column: Id
        type: number
        description: the comment Id Part of the declared primary key.
      - name: post_id
        column: PostId
        type: number
        description: Post Id. the unique id of the post
      - name: text
        column: Text
        type: string
        description: the detailed content of the comment
      - name: creation_date
        column: CreationDate
        type: time
        description: "Creation Date. the creation date of the comment Source date/time: inspect stored representation and
          cast before DuckDB date functions."
      - name: user_id
        column: UserId
        type: number
        description: User Id. the id of the user who post the comment
      - name: user_display_name
        column: UserDisplayName
        type: string
        description: User Display Name. user's display name
    measures:
      - name: score
        column: Score
        type: number
        description: rating score. commonsense evidence:The score is from 0 to 100. The score more than 60 refers that the
          comment is a positive comment. The score less than 60 refers that the comment is a negative comment.
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_id
        agg: count
        column: Id
        description: count of Id over the selected comments records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_distinct_id
        agg: count_distinct
        column: Id
        description: count distinct of Id over the selected comments records. Apply filters and grouping explicitly; joins
          can repeat records.
  - name: post_history
    table: postHistory
    description: One revision/history event on a post, not one post. Reference-informed from this database and its dev
      golden SQL. Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: Id
        type: number
        description: the post history id Part of the declared primary key.
      - name: post_history_type_id
        column: PostHistoryTypeId
        type: number
        description: Post History Type Id. the id of the post history type
      - name: post_id
        column: PostId
        type: number
        description: Post Id. the unique id of the post
      - name: revision_guid
        column: RevisionGUID
        type: string
        description: Revision GUID. the revision globally unique id of the post
      - name: creation_date
        column: CreationDate
        type: time
        description: "Creation Date. the creation date of the post Source date/time: inspect stored representation and cast
          before DuckDB date functions."
      - name: user_id
        column: UserId
        type: number
        description: User Id. the user who post the post
      - name: text
        column: Text
        type: string
        description: the detailed content of the post
      - name: comment
        column: Comment
        type: string
        description: comments of the post
      - name: user_display_name
        column: UserDisplayName
        type: string
        description: User Display Name. user's display name
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_distinct_post_history_type_id
        agg: count_distinct
        column: PostHistoryTypeId
        description: count distinct of PostHistoryTypeId over the selected postHistory records. Apply filters and grouping
          explicitly; joins can repeat records.
      - name: count_id
        agg: count
        column: Id
        description: count of Id over the selected postHistory records. Apply filters and grouping explicitly; joins can
          repeat records.
  - name: post_links
    table: postLinks
    description: One directed post-to-related-post link; PostId and RelatedPostId are distinct roles.
      Reference-informed from this database and its dev golden SQL. Preserve record identity for top-N; joins may
      multiply rows.
    dimensions:
      - name: id
        column: Id
        type: number
        description: the post link id Part of the declared primary key.
      - name: creation_date
        column: CreationDate
        type: time
        description: "Creation Date. the creation date of the post link Source date/time: inspect stored representation and
          cast before DuckDB date functions."
      - name: post_id
        column: PostId
        type: number
        description: Post Id. the post id
      - name: related_post_id
        column: RelatedPostId
        type: number
        description: Related Post Id. the id of the related post
      - name: link_type_id
        column: LinkTypeId
        type: number
        description: Link Type Id. the id of the link type
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_id
        agg: count
        column: Id
        description: count of Id over the selected postLinks records. Apply filters and grouping explicitly; joins can
          repeat records.
  - name: posts
    table: posts
    description: One question or answer post. OwnerUserId, LastEditorUserId, ParentId and AcceptedAnswerId have
      different roles. Physical spellings CreaionDate and LasActivityDate are intentional. Reference-informed from
      this database and its dev golden SQL. Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: Id
        type: number
