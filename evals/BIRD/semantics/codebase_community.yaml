      - name: score
        column: Score
        type: number
        description: the score of the post
      - name: view_count
        column: ViewCount
        type: number
        description: View Count. the view count of the post. commonsense evidence:Higher view count means the post has
          higher popularity
      - name: answer_count
        column: AnswerCount
        type: number
        description: Answer Count. the total number of answers of the post
      - name: comment_count
        column: CommentCount
        type: number
        description: Comment Count. the total number of comments of the post
      - name: favorite_count
        column: FavoriteCount
        type: number
        description: Favorite Count. the total number of favorites of the post. commonsense evidence:more favorite count
          refers to more valuable posts.
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_id
        agg: count
        column: Id
        description: count of Id over the selected posts records. Apply filters and grouping explicitly; joins can repeat
