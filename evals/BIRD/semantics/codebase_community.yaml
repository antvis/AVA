        column: AcceptedAnswerId
        type: number
        description: Accepted Answer Id. the accepted answer id of the post
      - name: creaion_date
        column: CreaionDate
        type: time
        description: "Creation Date. the creation date of the post Source date/time: inspect stored representation and cast
          before DuckDB date functions."
      - name: body
        column: Body
        type: string
        description: the body of the post
      - name: owner_user_id
        column: OwnerUserId
        type: number
        description: Owner User Id. the id of the owner user
      - name: las_activity_date
        column: LasActivityDate
        type: time
        description: "Last Activity Date. the last activity date Source date/time: inspect stored representation and cast
          before DuckDB date functions."
      - name: title
        column: Title
        type: string
        description: the title of the post
      - name: tags
        column: Tags
        type: string
        description: the tag of the post
      - name: last_editor_user_id
        column: LastEditorUserId
        type: number
        description: Last Editor User Id. the id of the last editor
      - name: last_edit_date
        column: LastEditDate
        type: time
        description: "Last Edit Date. the last edit date Source date/time: inspect stored representation and cast before
          DuckDB date functions."
      - name: community_owned_date
        column: CommunityOwnedDate
        type: time
        description: "Community Owned Date. the community owned date Source date/time: inspect stored representation and
          cast before DuckDB date functions."
      - name: parent_id
        column: ParentId
        type: number
        description: ParentId. the id of the parent post. commonsense evidence:If the parent id is null, the post is the
          root post. Otherwise, the post is the child post of other post.
      - name: closed_date
        column: ClosedDate
        type: time
        description: "Source closure timestamp. Benchmark questions use IS NOT NULL for well-finished and IS NULL for not
          well-finished; this is a benchmark convention. Source date/time: inspect stored representation and cast
          before DuckDB date functions."
      - name: owner_display_name
        column: OwnerDisplayName
        type: string
        description: Owner Display Name. the display name of the post owner
      - name: last_editor_display_name
        column: LastEditorDisplayName
        type: string
        description: Last Editor Display Name. the display name of the last editor
