  - name: superhero
    table: superhero
    description: One superhero record; id is unique, names may repeat. Eye, hair and skin colour are separate roles.
      Height in cm, weight in kg; zero/NULL can denote missing values, so apply exclusions only when required.
      Reference-informed from this database and its dev golden SQL. Preserve record identity for top-N; joins may
      multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique identifier of the superhero Part of the declared primary key.
      - name: superhero_name
        column: superhero_name
        type: string
        description: superhero name. the name of the superhero
      - name: full_name
        column: full_name
        type: string
        description: full name. the full name of the superhero. commonsense evidence:The full name of a person typically
          consists of their given name, also known as their first name or personal name, and their surname, also
          known as their last name or family name. For example, if someone's given name is "John" and their surname
          is "Smith," their full name would be "John Smith."
      - name: gender_id
        column: gender_id
        type: number
        description: gender id. the id of the superhero's gender
      - name: eye_colour_id
        column: eye_colour_id
        type: number
        description: eye colour id. the id of the superhero's eye color
      - name: hair_colour_id
        column: hair_colour_id
        type: number
        description: hair colour id. the id of the superhero's hair color
      - name: skin_colour_id
        column: skin_colour_id
        type: number
        description: skin colour id. the id of the superhero's skin color
      - name: race_id
        column: race_id
        type: number
        description: race id. the id of the superhero's race
      - name: publisher_id
        column: publisher_id
        type: number
        description: publisher id. the id of the publisher
      - name: alignment_id
        column: alignment_id
        type: number
        description: alignment id. the id of the superhero's alignment
    measures:
      - name: height_cm
        column: height_cm
        type: number
        description: height cm. the height of the superhero. commonsense evidence:The unit of height is centimeter. If the
          height_cm is NULL or 0, it means the height of the superhero is missing.
      - name: weight_kg
        column: weight_kg
        type: number
        description: weight kg. the weight of the superhero. commonsense evidence:The unit of weight is kilogram. If the
          weight_kg is NULL or 0, it means the weight of the superhero is missing.
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_id
        agg: count
        column: id
        description: count of id over the selected superhero records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: avg_height_cm
        agg: avg
        column: height_cm
        description: avg of height_cm over the selected superhero records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_superhero_name
        agg: count
        column: superhero_name
        description: count of superhero_name over the selected superhero records. Apply filters and grouping explicitly;
          joins can repeat records.
      - name: avg_weight_kg
        agg: avg
        column: weight_kg
        description: avg of weight_kg over the selected superhero records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: sum_weight_kg
        agg: sum
        column: weight_kg
        description: sum of weight_kg over the selected superhero records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: sum_height_cm
        agg: sum
        column: height_cm
        description: sum of height_cm over the selected superhero records. Apply filters and grouping explicitly; joins can
          repeat records.
