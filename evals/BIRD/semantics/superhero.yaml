# Source-grounded BIRD dev_20251106 configuration; see README.md and provenance.json.
dialect: duckdb
models:
  - name: alignment
    table: alignment
    description: One alignment label. Reference-informed from this database and its dev golden SQL. Preserve record
      identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique identifier of the alignment Part of the declared primary key.
      - name: alignment
        column: alignment
        type: string
        description: "the alignment of the superhero. commonsense evidence:Alignment refers to a character's moral and
          ethical stance and can be used to describe the overall attitude or behavior of a superhero. Some common
          alignments for superheroes include:Good: These superheroes are typically kind, selfless, and dedicated to
          protecting others and upholding justice. Examples of good alignments include Superman, Wonder Woman, and
          Spider-Man.Neutral: These superheroes may not always prioritize the greater good, but they are not
          necessarily evil either. They may act in their own self-interest or make decisions based on their own
          moral code. Examples of neutral alignments include the Hulk and Deadpool. Bad: These superheroes are
          typically selfish, manipulative, and willing to harm others in pursuit of their own goals. Examples of
          evil alignments include Lex Luthor and the Joker."
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
  - name: attribute
    table: attribute
    description: One attribute definition, distinct from a named superpower. Reference-informed from this database and
      its dev golden SQL. Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique identifier of the attribute Part of the declared primary key.
      - name: attribute_name
        column: attribute_name
        type: string
        description: attribute name. the attribute. commonsense evidence:A superhero's attribute is a characteristic or
          quality that defines who they are and what they are capable of. This could be a physical trait, such as
          superhuman strength or the ability to fly, or a personal trait, such as extraordinary intelligence or
          exceptional bravery.
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
  - name: colour
    table: colour
    description: One colour label reused for eye, hair and skin roles. Reference-informed from this database and its
      dev golden SQL. Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique identifier of the color Part of the declared primary key.
      - name: colour
        column: colour
        type: string
        description: the color of the superhero's skin/eye/hair/etc
    measures: []
    metrics:
