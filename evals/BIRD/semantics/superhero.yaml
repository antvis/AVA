        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
  - name: hero_attribute
    table: hero_attribute
    description: One hero-attribute value. Multiple attributes per hero; filter attribute name before ranking
      attribute_value. Reference-informed from this database and its dev golden SQL. Preserve record identity for
      top-N; joins may multiply rows.
    dimensions:
      - name: hero_id
        column: hero_id
        type: number
        description: hero id. the id of the heroMaps to superhero(id)
      - name: attribute_id
        column: attribute_id
        type: number
        description: attribute id. the id of the attributeMaps to attribute(id)
    measures:
      - name: attribute_value
        column: attribute_value
        type: number
        description: attribute value. the attribute value. commonsense evidence:If a superhero has a higher attribute value
          on a particular attribute, it means that they are more skilled or powerful in that area compared to other
          superheroes. For example, if a superhero has a higher attribute value for strength, they may be able to
          lift heavier objects or deliver more powerful punches than other superheroes.
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: avg_attribute_value
        agg: avg
        column: attribute_value
        description: avg of attribute_value over the selected hero_attribute records. Apply filters and grouping
          explicitly; joins can repeat records.
      - name: count_hero_id
        agg: count
        column: hero_id
        description: count of hero_id over the selected hero_attribute records. Apply filters and grouping explicitly;
          joins can repeat records.
      - name: max_attribute_value
        agg: max
        column: attribute_value
        description: max of attribute_value over the selected hero_attribute records. Apply filters and grouping
          explicitly; joins can repeat records.
      - name: min_attribute_value
        agg: min
        column: attribute_value
        description: min of attribute_value over the selected hero_attribute records. Apply filters and grouping
          explicitly; joins can repeat records.
  - name: hero_power
    table: hero_power
    description: One hero-power association. Joining attributes and powers multiplies rows; count distinct hero IDs
      when asking for heroes. Reference-informed from this database and its dev golden SQL. Preserve record
      identity for top-N; joins may multiply rows.
    dimensions:
      - name: hero_id
        column: hero_id
