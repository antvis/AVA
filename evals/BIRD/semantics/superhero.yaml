        description: hero id. the id of the heroMaps to superhero(id)
      - name: power_id
        column: power_id
        type: number
        description: power id. the id of the powerMaps to superpower(id). commonsense evidence:In general, a superhero's
          attributes provide the foundation for their abilities and help to define who they are, while their powers
          are the specific abilities that they use to fight crime and protect others.
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_hero_id
        agg: count
        column: hero_id
        description: count of hero_id over the selected hero_power records. Apply filters and grouping explicitly; joins
          can repeat records.
      - name: count_power_id
        agg: count
        column: power_id
        description: count of power_id over the selected hero_power records. Apply filters and grouping explicitly; joins
          can repeat records.
