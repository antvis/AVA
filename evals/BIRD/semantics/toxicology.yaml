joins:
  - from: atom
    to: molecule
    type: left
    keys:
      - from: molecule_id
        to: molecule_id
  - from: bond
    to: molecule
    type: left
    keys:
      - from: molecule_id
        to: molecule_id
  - from: connected
    to: bond
    type: left
    keys:
      - from: bond_id
        to: bond_id
  - from: connected
    to: connected_atom_id2_role
    type: left
    keys:
      - from: atom_id2
        to: atom_id
  - from: connected
    to: connected_atom_id_role
    type: left
    keys:
      - from: atom_id
        to: atom_id
