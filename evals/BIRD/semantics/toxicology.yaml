        column: element
        description: count of element over the selected atom records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_distinct_atom_id
        agg: count_distinct
        column: atom_id
        description: count distinct of atom_id over the selected atom records. Apply filters and grouping explicitly; joins
          can repeat records.
      - name: count_distinct_molecule_id
        agg: count_distinct
        column: molecule_id
        description: count distinct of molecule_id over the selected atom records. Apply filters and grouping explicitly;
          joins can repeat records.
      - name: count_distinct_element
        agg: count_distinct
        column: element
        description: count distinct of element over the selected atom records. Apply filters and grouping explicitly; joins
          can repeat records.
  - name: connected_atom_id_role
    table: atom
    description: Join role for connected.atom_id -> atom.atom_id. Same physical table as atom. One atom in a molecule,
      identified by atom_id. Element symbols are lowercase. Reference-informed from this database and its dev
      golden SQL. Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: atom_id
        column: atom_id
        type: string
        description: atom id. the unique id of atoms Part of the declared primary key.
      - name: molecule_id
        column: molecule_id
        type: string
        description: molecule id. identifying the molecule to which the atom belongs. commonsense evidence:TRXXX_i
          represents ith atom of molecule TRXXX
      - name: element
        column: element
        type: string
        description: "the element of the toxicology. cl: chlorine c: carbon h: hydrogen o: oxygen s: sulfur n: nitrogen p:
          phosphorus na: sodium br: bromine f: fluorine i: iodine sn: Tin pb: lead te: tellurium ca: Calcium"
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: count_atom_id
        agg: count
        column: atom_id
        description: count of atom_id over the selected atom records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_element
        agg: count
        column: element
        description: count of element over the selected atom records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_distinct_atom_id
        agg: count_distinct
        column: atom_id
        description: count distinct of atom_id over the selected atom records. Apply filters and grouping explicitly; joins
          can repeat records.
      - name: count_distinct_molecule_id
        agg: count_distinct
        column: molecule_id
        description: count distinct of molecule_id over the selected atom records. Apply filters and grouping explicitly;
          joins can repeat records.
      - name: count_distinct_element
        agg: count_distinct
