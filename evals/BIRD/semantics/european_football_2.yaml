# Source-grounded BIRD dev_20251106 configuration; see README.md and provenance.json.
dialect: duckdb
models:
  - name: country
    table: Country
    description: One country. Reference-informed from this database and its dev golden SQL. Preserve record identity
      for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique id for countries Part of the declared primary key.
      - name: name
        column: name
        type: string
        description: country name
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
  - name: league
    table: League
    description: One league belonging to a country. Reference-informed from this database and its dev golden SQL.
      Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique id for leagues Part of the declared primary key.
      - name: country_id
        column: country_id
        type: number
        description: country id. the unique id for countries
      - name: name
        column: name
        type: string
        description: league name
    measures: []
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
  - name: match
    table: Match
    description: One match with home and away roles. Goals belong to teams, not to an individual player in a lineup
      slot. Player slots reference Player.player_api_id, not Player.id. Season is a season label, not calendar
      year. Reference-informed from this database and its dev golden SQL. Preserve record identity for top-N; joins
      may multiply rows.
