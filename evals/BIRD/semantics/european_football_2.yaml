  - name: player
    table: Player
    description: One player identified by player_api_id and player_fifa_api_id, with separate local row id. Attribute
      records are historical, not one row per player. Reference-informed from this database and its dev golden SQL.
      Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique id for players Part of the declared primary key.
      - name: player_api_id
        column: player_api_id
        type: number
        description: player api id. the id of the player api
      - name: player_name
        column: player_name
        type: string
        description: player name
      - name: player_fifa_api_id
        column: player_fifa_api_id
        type: number
        description: player federation international football association api id. the id of the player fifa api
      - name: birthday
        column: birthday
        type: string
        description: "the player's birthday. e.g. 1992-02-29 00:00:00 commonsense reasoning: Player A is older than player
          B means that A's birthday is earlier than B's"
    measures:
      - name: height
        column: height
        type: number
        description: Player height in centimetres according to question evidence.
      - name: weight
        column: weight
        type: number
        description: Recorded player weight. Retain source units; no unit conversion is implied by column type.
    metrics:
      - name: record_count
        agg: count
        description: Count source/joined rows at the active query grain; not automatically distinct entities after joins.
      - name: sum_height
        agg: sum
        column: height
        description: sum of height over the selected Player records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_id
        agg: count
        column: id
        description: count of id over the selected Player records. Apply filters and grouping explicitly; joins can repeat
          records.
      - name: count_distinct_player_api_id
        agg: count_distinct
        column: player_api_id
        description: count distinct of player_api_id over the selected Player records. Apply filters and grouping
          explicitly; joins can repeat records.
      - name: count_distinct_id
        agg: count_distinct
        column: id
        description: count distinct of id over the selected Player records. Apply filters and grouping explicitly; joins
          can repeat records.
      - name: max_height
        agg: max
        column: height
        description: max of height over the selected Player records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: min_height
        agg: min
        column: height
        description: min of height over the selected Player records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: count_distinct_player_name
        agg: count_distinct
        column: player_name
        description: count distinct of player_name over the selected Player records. Apply filters and grouping explicitly;
          joins can repeat records.
      - name: avg_weight
        agg: avg
        column: weight
        description: avg of weight over the selected Player records. Apply filters and grouping explicitly; joins can
          repeat records.
      - name: avg_height
        agg: avg
        column: height
        description: avg of height over the selected Player records. Apply filters and grouping explicitly; joins can
          repeat records.
  - name: player_attributes
    table: Player_Attributes
    description: One dated player-attribute observation. Multiple dates per player; select an observation or aggregate
      explicitly, and do not silently assume latest attributes. Reference-informed from this database and its dev
      golden SQL. Preserve record identity for top-N; joins may multiply rows.
    dimensions:
      - name: id
        column: id
        type: number
        description: the unique id for players Part of the declared primary key.
      - name: player_fifa_api_id
        column: player_fifa_api_id
        type: number
        description: player federation international football association api id. the id of the player fifa api
      - name: player_api_id
        column: player_api_id
        type: number
        description: player api id. the id of the player api
      - name: date
        column: date
        type: string
        description: date. e.g. 2016-02-18 00:00:00
      - name: preferred_foot
        column: preferred_foot
        type: string
        description: preferred foot. the player's preferred foot when attacking. right/ left
      - name: attacking_work_rate
        column: attacking_work_rate
        type: string
        description: "attacking work rate. the player's attacking work rate. commonsense reasoning: • high: implies that
          the player is going to be in all of your attack moves• medium: implies that the player will select the
          attack actions he will join in• low: remain in his position while the team attacks"
      - name: defensive_work_rate
        column: defensive_work_rate
        type: string
        description: "the player's defensive work rate. commonsense reasoning: • high: remain in his position and defense
          while the team attacks • medium: implies that the player will select the defensive actions he will join
          in• low: implies that the player is going to be in all of your attack moves instead of defensing"
    measures:
      - name: overall_rating
        column: overall_rating
        type: number
        description: "the overall rating of the player. commonsense reasoning: The rating is between 0-100 which is
          calculated by FIFA. Higher overall rating means the player has a stronger overall strength."
      - name: potential
        column: potential
        type: number
        description: "potential of the player. commonsense reasoning: The potential score is between 0-100 which is
          calculated by FIFA. Higher potential score means that the player has more potential"
      - name: crossing
        column: crossing
        type: number
        description: "the player's crossing score. commonsense reasoning: Cross is a long pass into the opponent's goal
          towards the header of sixth-yard teammate. The crossing score is between 0-100 which measures the
          tendency/frequency of crosses in the box. Higher potential score means that the player performs better in
          crossing actions."
      - name: finishing
        column: finishing
        type: number
        description: the player's finishing rate. 0-100 which is calculated by FIFA
      - name: heading_accuracy
        column: heading_accuracy
        type: number
        description: heading accuracy. the player's heading accuracy. 0-100 which is calculated by FIFA
      - name: short_passing
        column: short_passing
        type: number
        description: short passing. the player's short passing score. 0-100 which is calculated by FIFA
      - name: volleys
        column: volleys
        type: number
        description: the player's volley score. 0-100 which is calculated by FIFA
      - name: dribbling
        column: dribbling
        type: number
        description: the player's dribbling score. 0-100 which is calculated by FIFA
      - name: curve
        column: curve
        type: number
        description: the player's curve score. 0-100 which is calculated by FIFA
      - name: free_kick_accuracy
        column: free_kick_accuracy
        type: number
        description: free kick accuracy. the player's free kick accuracy. 0-100 which is calculated by FIFA
      - name: long_passing
        column: long_passing
        type: number
        description: long passing. the player's long passing score. 0-100 which is calculated by FIFA
      - name: ball_control
