name: ava-sqlserver-tests
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Ava_admin_test_2026!
      MSSQL_MEMORY_LIMIT_MB: '3072'
    ports:
      - '127.0.0.1:${AVA_SQLSERVER_TEST_PORT:-11433}:1433'
    mem_limit: 4g
    cpus: 2
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./init.sql:/mssql-server-setup-scripts.d/01-fixture.sql:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD=Sql_fixture_2026! /opt/mssql-tools18/bin/sqlcmd -S localhost -U ava_reader -d ava_sqlserver_test -C -b -Q "SELECT COUNT(*) FROM dbo.orders; SELECT COUNT(*) FROM dbo.paid_orders" -o /dev/null'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  sqlserver-data:
