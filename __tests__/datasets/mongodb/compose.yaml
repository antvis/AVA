name: ava-mongodb-tests
services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: local_fixture_root_password
    ports:
      - '127.0.0.1:${AVA_MONGODB_TEST_PORT:-17017}:27017'
    volumes:
      - ./init.js:/docker-entrypoint-initdb.d/01-fixture.js:ro
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --host 127.0.0.1 --username ava_test --password ava_test_password --authenticationDatabase ava_mongodb_test ava_mongodb_test --quiet --eval 'db.orders.countDocuments({}) === 4 ? 0 : 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
volumes:
  mongodb-data:
