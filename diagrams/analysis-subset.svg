<svg xmlns="http://www.w3.org/2000/svg" width="680" height="686" viewBox="0 0 680 686" role="img" aria-labelledby="title desc">
<title id="title">Subset analysis flow</title>
<desc id="desc">Reuse an existing profile, or compute one if supported. With a profile, select relevant statistics while retaining the full schema. Without a profile or any positive selections, keep the original context. Then run direct analysis.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a909b"/></marker></defs>
<style>
.label, .branch { font-family: system-ui, -apple-system, sans-serif; text-anchor: middle; fill: #203c4a; font-size: 14px; }
.branch { font-size: 12px; fill: #526e7c; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
.node { fill: #f8fafb; stroke: #cbd7de; stroke-width: 1.3; }
.accent, .decision { fill: #edf9fc; stroke: #73b9c9; stroke-width: 1.3; }
.error { fill: #fff6f3; stroke: #e3b8a8; }
.edge { fill: none; stroke: #7a909b; stroke-width: 1.5; stroke-linejoin: round; }
</style>
<path d="M230 72 V112" class="edge" marker-end="url(#arrow)"/>
<path d="M230 176 V218" class="edge" marker-end="url(#arrow)"/>
<path d="M360 264 H665 V572 H645" class="edge" marker-end="url(#arrow)"/>
<path d="M230 310 V352" class="edge" marker-end="url(#arrow)"/>
<path d="M230 408 V450" class="edge" marker-end="url(#arrow)"/>
<path d="M360 496 H425" class="edge" marker-end="url(#arrow)"/>
<path d="M230 542 V582" class="edge" marker-end="url(#arrow)"/>
<path d="M230 638 V662 H570 V598" class="edge" marker-end="url(#arrow)"/>
<path d="M535 528 V546" class="edge" marker-end="url(#arrow)"/>
<rect x="80" y="24" width="300" height="48" rx="10" class="node accent"/><text x="230.0" y="53.0" class="label"><tspan x="230.0" dy="0">Question + full schema</tspan></text>
<rect x="80" y="112" width="300" height="64" rx="10" class="node "/><text x="230.0" y="139.0" class="label"><tspan x="230.0" dy="0">Reuse an existing profile</tspan><tspan x="230.0" dy="20">or compute one if supported</tspan></text>
<path d="M230 218 L360 264 L230 310 L100 264 Z" class="decision"/><text x="230" y="269" class="label"><tspan x="230" dy="0">Profile available?</tspan></text>
<rect x="80" y="352" width="300" height="56" rx="10" class="node "/><text x="230.0" y="375.0" class="label"><tspan x="230.0" dy="0">Select relevant tables and fields</tspan><tspan x="230.0" dy="20">from the question + full schema</tspan></text>
<path d="M230 450 L360 496 L230 542 L100 496 Z" class="decision"/><text x="230" y="501" class="label"><tspan x="230" dy="0">Any positive selections?</tspan></text>
<rect x="425" y="470" width="220" height="58" rx="10" class="node "/><text x="535.0" y="494.0" class="label"><tspan x="535.0" dy="0">Keep selected statistics</tspan><tspan x="535.0" dy="20">and the full schema</tspan></text>
<rect x="80" y="582" width="300" height="56" rx="10" class="node "/><text x="230.0" y="605.0" class="label"><tspan x="230.0" dy="0">Keep all profile details</tspan><tspan x="230.0" dy="20">and the full schema</tspan></text>
<rect x="425" y="546" width="220" height="52" rx="10" class="node accent"/><text x="535.0" y="577.0" class="label"><tspan x="535.0" dy="0">Run Direct analysis</tspan></text>
<text x="247" y="338" class="branch"><tspan x="247" dy="0">Yes</tspan></text>
<text x="405" y="252" class="branch"><tspan x="405" dy="0">No profile</tspan></text>
<text x="393" y="484" class="branch"><tspan x="393" dy="0">Yes</tspan></text>
<text x="247" y="568" class="branch"><tspan x="247" dy="0">No</tspan></text>
</svg>
