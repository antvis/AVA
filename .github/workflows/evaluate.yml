name: Evaluate

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️　Checkout
        uses: actions/checkout@v5

      - name: 🎉　Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: 📦　Install dependencies
        run: npm install

      - name: 🚀　Build
        run: npm run build

      - name: ✅　Run evaluation
        env:
          TBOX_LLM_APP_ID: ${{ secrets.TBOX_LLM_APP_ID }}
          TBOX_LLM_AUTH: ${{ secrets.TBOX_LLM_AUTH }}
        run: npm run evaluate
