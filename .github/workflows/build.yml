name: build

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - ai
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run tests
        run: npm test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: Build
        run: npm run build

      - name: Load package entry points in Node
        run: |
          node --input-type=module -e "const { sourceInputSchema } = await import('@antv/ava'); sourceInputSchema.parse({ type: 'json', options: { data: [] } })"
          node -e "require('@antv/ava').sourceInputSchema.parse({ type: 'json', options: { data: [] } })"
          node --input-type=module -e "const { sourceInputSchema } = await import('@antv/ava/browser'); sourceInputSchema.parse({ type: 'json', options: { data: [] } })"
          node -e "require('@antv/ava/browser').sourceInputSchema.parse({ type: 'json', options: { data: [] } })"

  windows-cli-session:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Exercise the installed dataset session in PowerShell
        shell: pwsh
        run: ./__tests__/cli/windows-session.ps1
