<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Data Visualization</title>
    <script src="https://unpkg.com/@antv/gpt-vis/dist/umd/index.min.js"></script>
    <style>
      html, body, #container {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <script>
      const gptVis = new GPTVis.GPTVis({
        container: '#container',
      });

      const visConfig = {"type":"bar","title":"各产品收入变化 2025年2月较1月 美元","data":[{"category":"Analytics","value":6000},{"category":"Automation","value":2000},{"category":"Support","value":500},{"category":"Reporting","value":-1000}],"axisXTitle":"产品","axisYTitle":"收入变化 美元"};

      gptVis.render(visConfig);
    </script>
  </body>
</html>
