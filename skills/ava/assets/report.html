<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <title>AVA 分析报告</title>
    <style>
      /* -----------------------------------------------------------------------
       基础变量与排版
       ----------------------------------------------------------------------- */
      :root {
        --ink: #202020;
        --muted: #737373;
        --line: #ebebeb;
        --surface: #fafafa;
        --mono: 'SFMono-Regular', Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: auto;
        scroll-padding-top: 24px;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font: 14px/1.8 'Avenir Next', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid #737373;
        outline-offset: 4px;
      }
      .skip {
        position: absolute;
        top: -60px;
        left: 20px;
        background: white;
        padding: 8px 14px;
        border-radius: 10px;
        z-index: 3;
      }
      .skip:focus {
        top: 8px;
      }
      button {
        border: 1px solid #e4e4e4;
        background: #fff;
        color: #525252;
        border-radius: 9px;
        padding: 5px 11px;
        font-size: 11px;
        transition: background 0.15s, color 0.15s;
      }
      button:hover {
        background: #ededed;
        color: var(--ink);
      }
      /* -----------------------------------------------------------------------
       报告摘要、指标与问题导航
       ----------------------------------------------------------------------- */
      main {
        max-width: 1120px;
        margin: 0 auto;
      }
      .report-intro {
        padding: 36px 40px 22px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 29px;
        line-height: 1.5;
        font-weight: 600;
        letter-spacing: -0.8px;
        overflow-wrap: anywhere;
      }
      .summary,
      .conclusion {
        white-space: pre-line;
      }
      .summary {
        max-width: 820px;
        margin: 0;
        color: #5e5e5e;
        font-size: 14px;
        line-height: 1.9;
      }
      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }
      .overview {
        margin: 0 40px;
        padding: 0 0 26px;
        border-bottom: 1px solid var(--line);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        padding: 22px 0;
        border-radius: 18px;
        background: var(--surface);
      }
      .metric {
        min-width: 0;
        padding: 0 24px;
        border-right: 1px solid #e4e4e4;
      }
      .metric:last-child {
        border-right: 0;
      }
      .metric-label {
        color: #666666;
        font-size: 11px;
      }
      .metric-value {
        margin-top: 5px;
        font-size: 33px;
        font-weight: 500;
        letter-spacing: -1px;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .metric-unit {
        display: inline-block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        margin-left: 6px;
        letter-spacing: 0;
      }
      .report-index {
        margin-top: 20px;
      }
      .metrics[hidden] + .report-index {
        margin-top: 0;
      }
      .question-index {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 20px;
        margin: 0;
        padding: 0;
        list-style: none;
        min-width: 0;
      }
      .question-index li {
        margin: 0;
        min-width: 0;
        max-width: 100%;
      }
      .question-index a {
        display: flex;
        align-items: center;
        gap: 7px;
        max-width: 300px;
        padding: 3px 0;
        font-size: 11px;
        color: #5e5e5e;
      }
      .question-index a:hover {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .question-index b {
        font: 10px var(--mono);
        color: var(--muted);
      }
      .question-index span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* -----------------------------------------------------------------------
       章节、图表、数据表与 SQL
       ----------------------------------------------------------------------- */
      .analysis {
        padding: 30px 40px 34px;
      }
      .analysis + .analysis {
        border-top: 1px solid var(--line);
      }
      .section-label {
        float: left;
        margin: 5px 12px 0 0;
        color: var(--muted);
        font: 11px/1.9 var(--mono);
      }
      h2 {
        margin: 0 0 12px;
        font-size: 19px;
        font-weight: 600;
        line-height: 1.6;
        letter-spacing: -0.25px;
        overflow-wrap: anywhere;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 500;
        color: #525252;
      }
      .conclusion {
        font-size: 13px;
        color: #5e5e5e;
        margin: 0 0 20px;
        line-height: 1.95;
      }
      .panel {
        position: relative;
        padding-top: 56px;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        background: #fff;
      }
      .view-tabs {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 1;
        display: flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fff;
        box-shadow: 0 2px 8px #00000008;
      }
      .view-tabs button {
        border: 0;
        border-radius: 7px;
        padding: 4px 11px;
        line-height: 18px;
        background: transparent;
      }
      .view-tabs button:hover:not(:disabled) {
        background: #f3f3f3;
      }
      .view-tabs button[aria-selected='true'] {
        background: var(--ink);
        color: #fff;
      }
      .view-tabs button[aria-selected='true']:hover {
        background: #404040;
      }
      .view-tabs button:disabled {
        color: #b8b8b8;
        cursor: not-allowed;
      }
      .view-panel {
        min-height: 282px;
      }
      figure {
        margin: 0;
        padding: 18px 16px 14px;
        min-width: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 250px;
        border: 0;
        background: white;
        border-radius: 8px;
      }
      .data-count {
        margin: 0;
        padding: 0 20px 12px;
        font-size: 10px;
        color: var(--muted);
      }
      .table-scroll {
        max-height: 300px;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: #d4d4d4 transparent;
        min-width: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 7px 20px;
        line-height: 18px;
        white-space: nowrap;
        border-bottom: 1px solid #f0f0f0;
      }
      th {
        position: sticky;
        top: 0;
        background: #f9f9f9;
        color: #666666;
        font-size: 11px;
        font-weight: 400;
      }
      td {
        color: #404040;
      }
      tbody tr:last-child td {
        border: 0;
      }
      tbody tr:hover {
        background: #fafafa;
      }
      .numeric {
        font-family: var(--mono);
        font-size: 11px;
      }
      .empty {
        margin: 0;
        padding: 16px 20px;
        color: var(--muted);
        font-size: 12px;
      }
      .sql {
        padding-top: 14px;
        background: #fafafa;
      }
      .sql-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 2px 20px 14px;
        font-size: 11px;
        color: var(--muted);
      }
      .copy {
        flex-shrink: 0;
        padding: 4px 10px;
        font-size: 11px;
      }
      pre {
        margin: 0 12px;
        padding: 16px;
        overflow: auto;
        border-radius: 10px;
        background: #f0f0f0;
        color: #404040;
        font: 11px/1.9 var(--mono);
        tab-size: 2;
      }
      code {
        font: inherit;
      }
      .sql-token-keyword {
        color: #0550ae;
        font-weight: 600;
      }
      .sql-token-function {
        color: #8250df;
      }
      .sql-token-string {
        color: #116329;
      }
      .sql-token-number {
        color: #953800;
      }
      .sql-token-comment {
        color: #6e7781;
        font-style: italic;
      }
      .sql-token-identifier {
        color: #57606a;
      }
      .query-id {
        margin: 0;
        padding: 12px 20px 16px;
        font: 10px/1.7 var(--mono);
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .notice {
        padding: 12px 16px;
        margin: 12px;
        border-radius: 12px;
        background: var(--surface);
        color: #616161;
        font-size: 12px;
      }
      .analysis > .notice {
        margin: 0 0 16px;
      }
      #truncation {
        margin: 0 40px 20px;
      }
      /* -----------------------------------------------------------------------
       来源、限制与页脚
       ----------------------------------------------------------------------- */
      .sources {
        margin: 0 40px;
        padding: 28px 0 0;
        border-top: 1px solid var(--line);
      }
      .sources-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px 20px;
        margin-bottom: 20px;
      }
      .sources h2 {
        margin: 0;
        font-size: 16px;
      }
      .source-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 32px;
      }
      ul {
        padding-left: 16px;
        margin: 0;
        font-size: 12px;
        color: #666666;
      }
      li + li {
        margin-top: 6px;
      }
      .source-grid li {
        overflow-wrap: anywhere;
      }
      .limitations {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 14px;
        background: var(--surface);
      }
      .limitations ul {
        font-size: 11px;
      }
      footer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        padding: 26px 40px;
        color: var(--muted);
        font-size: 10px;
      }
      .antv-brand {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #525252;
        font-size: 11px;
        font-weight: 500;
        line-height: 1;
      }
      .antv-brand img {
        display: block;
        width: 14px;
        height: auto;
      }
      /* -----------------------------------------------------------------------
       可访问性与状态反馈
       ----------------------------------------------------------------------- */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      #status {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        background: #252525;
        color: #fff;
        border-radius: 12px;
        font-size: 12px;
        padding: 10px 18px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      #status.visible {
        opacity: 1;
      }
      /* -----------------------------------------------------------------------
       窄屏适配
       ----------------------------------------------------------------------- */
      @media (max-width: 760px) {
        .report-intro {
          padding: 26px 22px 20px;
        }
        h1 {
          font-size: 25px;
        }
        .summary {
          font-size: 13px;
        }
        .meta {
          font-size: 10px;
        }
        .overview {
          margin: 0 22px;
          padding-bottom: 22px;
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          padding: 6px 0;
          border-radius: 15px;
        }
        .metric {
          padding: 16px 18px;
          border-right: 0;
        }
        .metric:nth-child(2n + 1) {
          border-right: 1px solid #e4e4e4;
        }
        .metric:only-child {
          border-right: 0;
        }
        .metric-value {
          font-size: 29px;
        }
        .report-index {
          margin-top: 18px;
        }
        .question-index {
          gap: 5px 14px;
        }
        .question-index a {
          max-width: 100%;
        }
        .analysis {
          padding: 26px 22px 28px;
        }
        .section-label {
          margin-top: 3px;
        }
        h2 {
          font-size: 17px;
        }
        .conclusion {
          font-size: 13px;
        }
        .panel {
          border-radius: 15px;
        }
        .view-panel {
          min-height: 267px;
        }
        iframe {
          height: 235px;
        }
        th,
        td {
          padding-inline: 16px;
        }
        .data-count {
          padding-inline: 16px;
        }
        .sql-meta {
          flex-wrap: wrap;
          padding-inline: 16px;
        }
        .sql-meta > span {
          overflow-wrap: anywhere;
          min-width: 0;
        }
        .query-id {
          padding-inline: 16px;
        }
        .source-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .sources {
          margin: 0 22px;
          padding-top: 24px;
        }
        .limitations {
          padding: 16px;
        }
        footer {
          padding: 24px 22px;
        }
        #truncation {
          margin-inline: 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button,
        #status {
          transition: none;
        }
      }
      /* -----------------------------------------------------------------------
       打印布局
       ----------------------------------------------------------------------- */
      @media print {
        .copy,
        .view-tabs,
        #status,
        .skip,
        .report-index {
          display: none;
        }
        body {
          background: white;
        }
        main {
          max-width: none;
          margin: 0;
        }
        .report-intro,
        .analysis,
        .sources {
          padding: 16px 0;
        }
        .overview,
        .sources {
          margin: 0;
        }
        .table-scroll {
          max-height: none;
          overflow: visible;
        }
        .analysis,
        .sources {
          break-inside: avoid;
        }
        .panel {
          padding-top: 0;
        }
        iframe {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">跳到报告正文</a>
    <main id="main">
      <section class="report-intro" aria-label="报告摘要">
        <h1 data-field="title"></h1>
        <p class="summary" data-field="summary"></p>
      </section>
      <p class="notice" id="truncation" hidden>
        本报告包含截断的查询结果，请查看对应章节的完整性提示。
      </p>
      <section class="overview" aria-label="关键指标与分析路径">
        <div class="metrics" id="metrics" hidden></div>
        <nav class="report-index" aria-label="问题目录">
          <ol class="question-index" id="question-index"></ol>
        </nav>
      </section>
      <div id="sections"></div>
      <section class="sources" id="report-sources">
        <div class="sources-heading">
          <h2>口径与来源</h2>
          <p class="meta">
            生成于
            <time data-field="generatedAt"></time>
          </p>
        </div>
        <div class="source-grid">
          <div>
            <h3>数据来源</h3>
            <ul id="sources"></ul>
          </div>
          <div>
            <h3>分析口径</h3>
            <ul id="definitions"></ul>
          </div>
        </div>
        <div class="limitations">
          <h3>适用范围与限制</h3>
          <ul id="limitations"></ul>
        </div>
      </section>
      <footer>
        <span>Powered by</span>
        <span class="antv-brand">
          <img src="icon.svg" alt="" width="14" height="12" />
          <span>AntV</span>
        </span>
      </footer>
    </main>

    <!-- Repeated content has a fixed structure. Every report value is bound with textContent. -->
    <template id="metric-template">
      <div class="metric">
        <div class="metric-label" data-field="label"></div>
        <!-- 数值与单位之间的间距由 CSS 控制。 -->
        <!-- prettier-ignore -->
        <div class="metric-value">
  <span data-field="value"></span><span
    class="metric-unit"
    data-field="unit"
  ></span>
</div>
      </div>
    </template>
    <template id="section-template">
      <section class="analysis">
        <div class="section-label" data-field="number"></div>
        <h2 data-field="question"></h2>
        <p class="conclusion" data-field="conclusion"></p>
        <p class="notice truncated" hidden>结果已截断：下方数据不完整，请勿据此推断全量结果。</p>
        <div class="panel">
          <div class="view-tabs" role="tablist" aria-label="视图切换">
            <button type="button" role="tab" data-view="chart">Chart</button>
            <button type="button" role="tab" data-view="data">Data</button>
            <button type="button" role="tab" data-view="sql">SQL</button>
          </div>
          <figure class="view-panel" data-view="chart" role="tabpanel" tabindex="0" hidden>
            <iframe sandbox="allow-scripts"></iframe>
          </figure>
          <p class="notice chart-error" hidden></p>
          <div class="table-scroll view-panel" data-view="data" tabindex="0" role="tabpanel" hidden>
            <p class="data-count" data-field="count"></p>
            <table>
              <caption class="sr-only"></caption>
              <thead><tr></tr></thead>
              <tbody></tbody>
            </table>
            <p class="empty" hidden>查询未返回数据。</p>
          </div>
          <div class="sql view-panel" data-view="sql" role="tabpanel" tabindex="0" hidden>
            <div class="sql-meta">
              <span data-field="source"></span>
              <button type="button" class="copy">复制代码</button>
            </div>
            <pre><code data-field="sql"></code></pre>
            <p class="query-id" data-field="queryMeta"></p>
          </div>
        </div>
      </section>
    </template>
    <div id="status" role="status" aria-live="polite"></div>
    <!-- ARTIFACT_DATA -->
    <script>
      // -----------------------------------------------------------------------------
      // 读取证据与安全文本绑定
      // -----------------------------------------------------------------------------

      const report = JSON.parse(document.getElementById('artifact-data').textContent);
      const queries = new Map(report.queries.map((query) => [query.queryId, query]));
      const format = (value) =>
        value == null
          ? '—'
          : typeof value === 'number'
          ? new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 6 }).format(value)
          : typeof value === 'object'
          ? JSON.stringify(value)
          : String(value);
      const bind = (root, fields) =>
        root.querySelectorAll('[data-field]').forEach((node) => {
          node.textContent = fields[node.dataset.field] ?? '';
        });
      const list = (id, items) =>
        items.forEach((value) => {
          const item = document.createElement('li');
          item.textContent = value;
          document.getElementById(id).append(item);
        });
      const clone = (id) => document.getElementById(id).content.firstElementChild.cloneNode(true);

      // -----------------------------------------------------------------------------
      // SQL 高亮：只创建文本节点与标记，不解释查询内容
      // -----------------------------------------------------------------------------

      // shortcut: common SQL tokens, not a full dialect parser; use a bundled lexer if dialect support expands.
      function sqlTokens(sql) {
        const keywords = new Set(
          (
            'SELECT FROM WHERE WITH AS AND OR NOT IN IS NULL TRUE FALSE CASE WHEN THEN ' +
            'ELSE END GROUP BY ORDER HAVING LIMIT OFFSET JOIN LEFT RIGHT INNER OUTER FULL ' +
            'CROSS ON UNION ALL DISTINCT ASC DESC OVER PARTITION ROWS RANGE BETWEEN ' +
            'UNBOUNDED PRECEDING FOLLOWING CURRENT ROW FILTER QUALIFY EXCEPT INTERSECT ' +
            'VALUES CAST TRY_CAST DATE TIMESTAMP INTERVAL LIKE ILIKE EXISTS NULLS FIRST ' +
            'LAST'
          ).split(' '),
        );
        const pattern = new RegExp(
          [
            // 注释
            String.raw`(?<comment>--[^\r\n]*|\/\*[\s\S]*?\*\/)`,
            // 字符串与美元引用
            String.raw`(?<string>'(?:''|[^'])*'|\$\$[\s\S]*?\$\$|\$(?<tag>[A-Za-z_]\w*)\$[\s\S]*?\$\k<tag>\$)`,
            // 引用字段
            String.raw`(?<identifier>"(?:""|[^"])*")`,
            // 数值
            String.raw`(?<number>(?:\b\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)`,
            // 关键字或函数名
            String.raw`(?<word>\b[A-Za-z_]\w*\b)`,
          ].join('|'),
          'g',
        );
        const tokens = [];
        let offset = 0;
        for (const match of sql.matchAll(pattern)) {
          if (match.index > offset) {
            tokens.push({ text: sql.slice(offset, match.index) });
          }
          const text = match[0],
            end = match.index + text.length,
            groups = match.groups;
          const type =
            ['comment', 'string', 'identifier', 'number'].find(
              (name) => groups[name] !== undefined,
            ) ||
            (keywords.has(text.toUpperCase())
              ? 'keyword'
              : /^\s*\(/.test(sql.slice(end))
              ? 'function'
              : undefined);
          tokens.push({ text, type });
          offset = end;
        }
        if (offset < sql.length) {
          tokens.push({ text: sql.slice(offset) });
        }
        return tokens;
      }
      function highlightSQL(code, sql) {
        const fragment = document.createDocumentFragment();
        for (const { text, type } of sqlTokens(sql)) {
          const token = type ? document.createElement('span') : document.createTextNode(text);
          if (type) {
            token.className = 'sql-token-' + type;
            token.textContent = text;
          }
          fragment.append(token);
        }
        code.replaceChildren(fragment);
      }

      // -----------------------------------------------------------------------------
      // 摘要、指标与导航
      // -----------------------------------------------------------------------------

      const stamp = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        dateStyle: 'medium',
        timeStyle: 'short',
      }).format(new Date(report.generatedAt));
      document.title = report.title + ' · AVA';
      bind(document.getElementById('main'), {
        title: report.title,
        summary: report.summary,
        generatedAt: stamp,
      });
      document.querySelector('time[data-field="generatedAt"]').dateTime = report.generatedAt;
      document.getElementById('truncation').hidden = !report.queries.some(
        (query) => query.result.truncated,
      );
      document.getElementById('metrics').hidden = !report.metrics.length;
      report.metrics.forEach((metric) => {
        const query = queries.get(metric.queryId);
        const node = clone('metric-template');
        bind(node, {
          label: metric.label,
          value: format(query.result.data[metric.rowIndex][metric.field]),
          unit: metric.unit,
        });
        document.getElementById('metrics').append(node);
      });

      // -----------------------------------------------------------------------------
      // 按真实查询证据渲染章节
      // -----------------------------------------------------------------------------

      report.sections.forEach((section, index) => {
        const query = queries.get(section.queryId);
        const node = clone('section-template');
        node.id = 'analysis-' + (index + 1);
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = '#' + node.id;
        link.title = section.question;
        const badge = document.createElement('b');
        badge.textContent = String(index + 1).padStart(2, '0');
        const label = document.createElement('span');
        label.textContent = section.question;
        link.append(badge, label);
        item.append(link);
        document.getElementById('question-index').append(item);
        const columns = query.result.schema.map((column) => column.name);
        bind(node, {
          number: String(index + 1).padStart(2, '0'),
          question: section.question,
          conclusion: section.conclusion,
          source: '来源：' + query.source,
          sql: query.sql,
          count: query.result.data.length + ' 行 · ' + columns.length + ' 列',
          queryMeta: query.queryId + ' · ' + query.executedAt,
        });
        if (!query.language || query.language === 'sql') {
          highlightSQL(node.querySelector('[data-field="sql"]'), query.sql);
        }
        node.querySelector('h2').id = 'heading-' + (index + 1);
        node.setAttribute('aria-labelledby', 'heading-' + (index + 1));
        node.querySelector('.truncated').hidden = !query.result.truncated;
        node.querySelector('caption').textContent = section.question + '的结果数据';
        columns.forEach((name) => {
          const cell = document.createElement('th');
          cell.scope = 'col';
          cell.textContent = name;
          node.querySelector('thead tr').append(cell);
        });
        query.result.data.forEach((row) => {
          const tr = document.createElement('tr');
          columns.forEach((name) => {
            const cell = document.createElement('td');
            cell.textContent = format(row[name]);
            if (typeof row[name] === 'number') {
              cell.className = 'numeric';
            }
            tr.append(cell);
          });
          node.querySelector('tbody').append(tr);
        });
        node.querySelector('.empty').hidden = query.result.data.length > 0;

        // -----------------------------------------------------------------------------
        // 嵌入 AVA 原生图表
        // -----------------------------------------------------------------------------

        const chart = report.charts.find((chart) => chart.section === index + 1);
        if (chart) {
          const frame = node.querySelector('iframe');
          frame.title = section.question + ' — 交互图表';
          frame.srcdoc = chart.html;
          // GPT-Vis measures its container at mount; remount after a real width change.
          let width = 0;
          new ResizeObserver((entries) => {
            const next = entries[0].contentRect.width;
            if (!next) return;
            if (width && Math.abs(next - width) > 1) {
              frame.srcdoc = chart.html;
            }
            width = next;
          }).observe(frame);
        }
        const error = report.chartErrors.find((error) => error.section === index + 1);
        if (error) {
          node.querySelector('.chart-error').hidden = false;
          node.querySelector('.chart-error').textContent =
            '图表暂不可用：' + error.message + ' 结果表与查询代码已保留。';
        }

        const tablist = node.querySelector('.view-tabs');
        const tabs = [...tablist.querySelectorAll('[role="tab"]')];
        const views = [...node.querySelectorAll('[role="tabpanel"]')];
        tablist.setAttribute('aria-label', section.question + ' — 视图切换');
        tabs[0].disabled = !chart;
        const selectView = (selected) => {
          tabs.forEach((tab) => {
            const active = tab === selected;
            tab.setAttribute('aria-selected', String(active));
            tab.tabIndex = active ? 0 : -1;
          });
          views.forEach((view) => {
            view.hidden = view.dataset.view !== selected.dataset.view;
          });
        };
        tabs.forEach((tab, tabIndex) => {
          const view = views[tabIndex];
          tab.id = node.id + '-tab-' + tab.dataset.view;
          view.id = node.id + '-view-' + view.dataset.view;
          tab.setAttribute('aria-controls', view.id);
          view.setAttribute('aria-labelledby', tab.id);
          tab.addEventListener('click', () => selectView(tab));
        });
        tablist.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const enabled = tabs.filter((tab) => !tab.disabled);
          const current = enabled.indexOf(document.activeElement);
          const next =
            event.key === 'Home'
              ? 0
              : event.key === 'End'
              ? enabled.length - 1
              : (current + (event.key === 'ArrowRight' ? 1 : -1) + enabled.length) % enabled.length;
          selectView(enabled[next]);
          enabled[next].focus();
        });
        selectView(tabs.find((tab) => !tab.disabled));
        node.querySelector('.copy').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(query.sql);
            notify('查询代码已复制');
          } catch {
            notify('复制未成功，请在 SQL 视图中手动选择复制');
          }
        });
        document.getElementById('sections').append(node);
      });

      // -----------------------------------------------------------------------------
      // 来源、限制与复制反馈
      // -----------------------------------------------------------------------------

      list('sources', [...new Set(report.queries.map((query) => query.source))]);
      list(
        'definitions',
        report.definitions.length
          ? report.definitions
          : ['以各章节展示的查询代码为准；未额外声明业务口径。'],
      );
      list('limitations', [
        ...report.limitations,
        '报告内嵌的是查询结果，不包含原始文件的全部明细。',
        '正文、数据与查询代码可离线查看；交互图表需要联网加载 GPT-Vis。',
      ]);
      let toastTimer;
      function notify(message) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => status.classList.remove('visible'), 2400);
      }
    </script>
  </body>
</html>
